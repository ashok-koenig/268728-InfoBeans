spring.application.name=LearnlyConfig

spring.profiles.group.local=dev,inspect

logging.level.root=warn
spring.main.banner-mode=off

#learnly.mail.host=localhost
learnly.mail.port=25
learnly.mail.sender=noreply@learnly.example
learnly.mail.retry-count=3
learnly.mail.enabled=true

learnly.datasource.url=jdbc:mysql://localhost:3306/learnlydb
learnly.datasource.pool-size=5