spring.application.name=Learnly Config

spring.profiles.group.local=dev,inspect

logging.level.root=warn
spring.main.banner-mode=off

learnly.mail.host=localhost
learnly.mail.port=25
learnly.mail.sender=noreply@learnly.example
learnly.mail.retry-count=3
learnly.mail.password=mailpass
learnly.mail.enabled=true

learnly.datasource.url=jdbc:mysql://localhost:3306/learnlydb
learnly.datasource.pool-size=5

management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Learnly platform settings


management.endpoints.web.exposure.include=health,info,env,configprops
management.endpoint.env.show-values=ALWAYS
management.endpoint.configprops.show-values=ALWAYS
management.endpoint.health.show-details=always