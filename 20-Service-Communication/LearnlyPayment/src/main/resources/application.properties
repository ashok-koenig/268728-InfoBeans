spring.application.name=LearnlyPayment

server.port=${PORT:8082}

spring.datasource.url=${LEARNLY_DB_URL:jdbc:mysql://localhost:3306/learnly_payment}
spring.datasource.username=${LEARNLY_DB_USER:root}
spring.datasource.password=${LEARNLY_DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USER:artemis}
spring.artemis.password=${ARTEMIS_PASSWORD:artemis}