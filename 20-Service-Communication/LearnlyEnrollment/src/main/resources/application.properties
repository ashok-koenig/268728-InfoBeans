spring.application.name=Learnly-Enrollment

server.port=${PORT:8080}
app.instance-name=${INSTANCE_NAME:enrollment-1}

spring.datasource.url=${LEARNLY_DB_URL:jdbc:mysql://localhost:3306/learnly_enrollment}
spring.datasource.username=${LEARNLY_DB_USER:root}
spring.datasource.password=${LEARNLY_DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USER:artemis}
spring.artemis.password=${ARTEMIS_PASSWORD:artemis}

app.jwt-secret=${JWT_SECRET:learnly-dev-secret-change-me-0123456789}
app.token-minutes=30

spring.http.serviceclient.catalogue.base-url=${CATALOGUE_URL:http://localhost:8081}

spring.http.clients.connect-timeout=1s
spring.http.clients.read-timeout=1s

# Retry: up to 3 attempts, pause 100 ms then 200 ms; a 404 or an open breaker is an answer, not trouble
resilience4j.retry.instances.catalogue.max-attempts=3
resilience4j.retry.instances.catalogue.wait-duration=100ms
resilience4j.retry.instances.catalogue.enable-exponential-backoff=true
resilience4j.retry.instances.catalogue.ignore-exceptions=org.springframework.web.client.HttpClientErrorException,io.github.resilience4j.circuitbreaker.CallNotPermittedException

# Circuit breaker: look at the last 6 calls, open at 50 percent failures, stay open 10 seconds
resilience4j.circuitbreaker.instances.catalogue.sliding-window-size=6
resilience4j.circuitbreaker.instances.catalogue.minimum-number-of-calls=6
resilience4j.circuitbreaker.instances.catalogue.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogue.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.catalogue.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

# See the breaker at /actuator/circuitbreakers
management.endpoints.web.exposure.include=health,circuitbreakers
