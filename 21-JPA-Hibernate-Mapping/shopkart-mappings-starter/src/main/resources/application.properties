spring.application.name=shopkart-mappings-live

server.port=${PORT:8080}
spring.datasource.url=${SHOPKART_DB_URL:jdbc:mysql://localhost:3306/shopkartdb?rewriteBatchedStatements=true}
spring.datasource.username=${SHOPKART_DB_USER:root}
spring.datasource.password=${SHOPKART_DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.generate_statistics=true